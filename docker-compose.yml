services:
  web:
    build: .
    image: wechat-image-trace:latest
    container_name: wechat-image-trace
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATA_DIR: /app/backend/data
    volumes:
      # 指纹库与图片缓存持久化到宿主机，重建容器不丢数据
      - ./backend/data:/app/backend/data
    restart: unless-stopped
