services:
  - type: web
    name: wechat-image-trace
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && corepack enable && pnpm install --frozen-lockfile && pnpm build && cd ..
    startCommand: python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "22"
    disk:
      name: data
      mountPath: /app/backend/data
      sizeGB: 1
